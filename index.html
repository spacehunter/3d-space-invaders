<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D Space Invaders</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            background: #000;
            font-family: 'Courier New', monospace;
        }
        canvas {
            display: block;
        }
        #ui {
            position: absolute;
            top: 20px;
            left: 20px;
            color: #0f0;
            font-size: 24px;
            text-shadow: 0 0 3px #0f0;
            z-index: 100;
        }
        #gameOver {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: #f00;
            font-size: 48px;
            text-shadow: 0 0 5px #f00;
            display: none;
            text-align: center;
        }
        #instructions {
            position: absolute;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            color: #0ff;
            font-size: 16px;
            text-shadow: 0 0 3px #0ff;
            text-align: center;
        }
        #highscores {
            position: absolute;
            top: 20px;
            right: 20px;
            color: #ffff00;
            font-size: 16px;
            text-shadow: 0 0 3px #ffff00;
            z-index: 100;
            text-align: right;
        }
        #highscores h3 {
            margin: 0 0 10px 0;
            font-size: 20px;
            color: #00ff00;
            text-shadow: 0 0 4px #00ff00;
        }
        #highscores .score-entry {
            margin: 5px 0;
            color: #ffff00;
        }
        #highscores .rank {
            color: #00ffff;
            margin-right: 10px;
        }
        #settings {
            position: absolute;
            bottom: 60px;
            left: 50%;
            transform: translateX(-50%);
            color: #0ff;
            font-size: 14px;
            text-shadow: 0 0 3px #0ff;
            text-align: center;
            z-index: 100;
        }
        #settings label {
            display: block;
            margin-bottom: 5px;
        }
        #glowSlider {
            width: 200px;
            cursor: pointer;
        }
        #fps {
            position: absolute;
            bottom: 10px;
            left: 10px;
            color: #0f0;
            font-size: 14px;
            font-family: monospace;
            z-index: 100;
            pointer-events: none;
        }
        #version {
            position: absolute;
            bottom: 10px;
            right: 10px;
            color: #0f0;
            font-size: 14px;
            font-family: monospace;
            z-index: 100;
            pointer-events: none;
        }
        #levelIndicator {
            position: absolute;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            color: #00ffff;
            font-size: 28px;
            font-weight: bold;
            text-shadow: 0 0 10px #00ffff, 0 0 20px #00ffff;
            z-index: 100;
            letter-spacing: 3px;
            pointer-events: none;
        }
        #bossHealthBar {
            position: absolute;
            top: 70px;
            left: 50%;
            transform: translateX(-50%);
            width: 400px;
            z-index: 100;
            text-align: center;
            pointer-events: none;
        }
        #bossHealthBar .boss-name {
            color: #ff0000;
            font-size: 20px;
            font-weight: bold;
            text-shadow: 0 0 10px #ff0000;
            margin-bottom: 8px;
            animation: bossNamePulse 1s ease-in-out infinite;
        }
        @keyframes bossNamePulse {
            0%, 100% { text-shadow: 0 0 10px #ff0000; }
            50% { text-shadow: 0 0 20px #ff0000, 0 0 30px #ff4444; }
        }
        #bossHealthBar .health-bar-container {
            width: 100%;
            height: 16px;
            background: rgba(0, 0, 0, 0.8);
            border: 2px solid #ff0000;
            border-radius: 8px;
            overflow: hidden;
            position: relative;
            box-shadow: 0 0 10px rgba(255, 0, 0, 0.5);
        }
        #bossHealthBar .health-bar-fill {
            height: 100%;
            background: linear-gradient(90deg, #00ff00, #88ff88);
            transition: width 0.3s ease-out;
            box-shadow: 0 0 10px currentColor inset;
        }
        /* Level transition overlay */
        #transitionOverlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: none;
            justify-content: flex-start;
            align-items: center;
            flex-direction: column;
            padding-top: 18%;
            z-index: 200;
            pointer-events: none;
            background: transparent;
        }
        #transitionOverlay.active {
            display: flex;
        }
        #transitionOverlay .main-text {
            font-size: 72px;
            font-weight: bold;
            text-align: center;
            letter-spacing: 8px;
            opacity: 0;
            transform: scale(0.5);
            transition: all 0.5s ease-out;
        }
        #transitionOverlay .main-text.show {
            opacity: 1;
            transform: scale(1);
        }
        #transitionOverlay .sub-text {
            font-size: 36px;
            text-align: center;
            letter-spacing: 4px;
            margin-top: 20px;
            opacity: 0;
            transition: all 0.4s ease-out 0.2s;
        }
        #transitionOverlay .sub-text.show {
            opacity: 1;
        }
        .text-green {
            color: #00ff00;
            text-shadow: 0 0 20px #00ff00, 0 0 40px #00ff00, 0 0 60px #00ff00;
        }
        .text-yellow {
            color: #ffff00;
            text-shadow: 0 0 20px #ffff00, 0 0 40px #ffff00, 0 0 60px #ffff00;
        }
        .text-cyan {
            color: #00ffff;
            text-shadow: 0 0 20px #00ffff, 0 0 40px #00ffff, 0 0 60px #00ffff;
        }
        .text-red {
            color: #ff0000;
            text-shadow: 0 0 20px #ff0000, 0 0 40px #ff0000, 0 0 60px #ff0000;
            animation: bossTextPulse 0.5s ease-in-out infinite;
        }
        .text-magenta {
            color: #ff00ff;
            text-shadow: 0 0 20px #ff00ff, 0 0 40px #ff00ff, 0 0 60px #ff00ff;
        }
        @keyframes bossTextPulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.05); }
        }
        /* Landing Page Styles */
        #landingPage {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: radial-gradient(ellipse at center, rgba(0, 20, 40, 0.95) 0%, rgba(0, 0, 0, 0.98) 100%);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 500;
            transition: opacity 0.8s ease-out, visibility 0.8s ease-out;
        }
        #landingPage.hidden {
            opacity: 0;
            visibility: hidden;
            pointer-events: none;
        }
        .landing-content {
            text-align: center;
            animation: fadeInUp 1s ease-out;
        }
        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
        .game-title {
            font-size: 72px;
            font-weight: bold;
            margin: 0;
            letter-spacing: 12px;
            color: #00ff00;
            text-shadow:
                0 0 10px #00ff00,
                0 0 20px #00ff00,
                0 0 40px #00ff00,
                0 0 80px #00ff00;
            animation: titleGlow 2s ease-in-out infinite;
        }
        .title-invaders {
            color: #00ffff;
            text-shadow:
                0 0 10px #00ffff,
                0 0 20px #00ffff,
                0 0 40px #00ffff,
                0 0 80px #00ffff;
            animation: titleGlowCyan 2s ease-in-out infinite;
            animation-delay: 0.5s;
        }
        @keyframes titleGlow {
            0%, 100% {
                text-shadow:
                    0 0 10px #00ff00,
                    0 0 20px #00ff00,
                    0 0 40px #00ff00,
                    0 0 80px #00ff00;
            }
            50% {
                text-shadow:
                    0 0 20px #00ff00,
                    0 0 40px #00ff00,
                    0 0 60px #00ff00,
                    0 0 100px #00ff00;
            }
        }
        @keyframes titleGlowCyan {
            0%, 100% {
                text-shadow:
                    0 0 10px #00ffff,
                    0 0 20px #00ffff,
                    0 0 40px #00ffff,
                    0 0 80px #00ffff;
            }
            50% {
                text-shadow:
                    0 0 20px #00ffff,
                    0 0 40px #00ffff,
                    0 0 60px #00ffff,
                    0 0 100px #00ffff;
            }
        }
        .title-decoration {
            width: 400px;
            height: 2px;
            background: linear-gradient(90deg, transparent, #00ffff, transparent);
            margin: 20px auto 40px auto;
            box-shadow: 0 0 10px #00ffff;
        }
        .start-options {
            display: flex;
            flex-direction: column;
            gap: 20px;
            margin-bottom: 50px;
        }
        .start-prompt {
            font-size: 28px;
            color: #ffff00;
            text-shadow: 0 0 10px #ffff00, 0 0 20px #ffff00;
            animation: promptPulse 1.5s ease-in-out infinite;
            cursor: pointer;
            padding: 10px 30px;
            border: 2px solid transparent;
            transition: all 0.3s ease;
        }
        .start-prompt:hover {
            border-color: #ffff00;
            background: rgba(255, 255, 0, 0.1);
        }
        .continue-prompt {
            font-size: 24px;
            color: #00ff00;
            text-shadow: 0 0 10px #00ff00, 0 0 20px #00ff00;
            animation: promptPulse 1.5s ease-in-out infinite;
            animation-delay: 0.3s;
            cursor: pointer;
            padding: 10px 30px;
            border: 2px solid transparent;
            transition: all 0.3s ease;
        }
        .continue-prompt:hover {
            border-color: #00ff00;
            background: rgba(0, 255, 0, 0.1);
        }
        .continue-prompt #savedLevel {
            color: #00ffff;
            text-shadow: 0 0 10px #00ffff;
        }
        @keyframes promptPulse {
            0%, 100% {
                opacity: 1;
                transform: scale(1);
            }
            50% {
                opacity: 0.7;
                transform: scale(1.05);
            }
        }
        .landing-instructions {
            display: flex;
            justify-content: center;
            gap: 60px;
            margin-bottom: 40px;
        }
        .instruction-item {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }
        .instruction-item .key {
            font-size: 20px;
            color: #ff00ff;
            text-shadow: 0 0 8px #ff00ff;
            padding: 8px 20px;
            border: 2px solid #ff00ff;
            border-radius: 5px;
            box-shadow: 0 0 10px rgba(255, 0, 255, 0.3);
        }
        .instruction-item .action {
            font-size: 14px;
            color: #aaaaaa;
        }
        .feature-list {
            display: flex;
            justify-content: center;
            gap: 15px;
            font-size: 14px;
            color: #888888;
        }
        .feature {
            color: #00ff00;
            text-shadow: 0 0 5px rgba(0, 255, 0, 0.5);
        }
        .feature-divider {
            color: #444444;
        }
    </style>
</head>
<body>
    <div id="fps">FPS: 60</div>
    <div id="version"></div>
    <div id="levelIndicator">LEVEL 1</div>
    <div id="ui">
        <div>SCORE: <span id="score">0</span></div>
        <div>LIVES: <span id="lives">3</span></div>
    </div>
    <div id="highscores">
        <h3>HIGH SCORES</h3>
        <div id="highscores-list"></div>
    </div>
    <div id="gameOver">
        <div>GAME OVER</div>
        <div style="font-size: 24px; margin-top: 20px;">Click to Restart</div>
    </div>
    <div id="instructions">
        Move Mouse: Control Ship | Click: Fire Missile
    </div>
    <div id="settings">
        <label for="glowSlider">GLOW INTENSITY: <span id="glowValue">1.50</span></label>
        <input type="range" id="glowSlider" min="0" max="3" step="0.05" value="1.5">
    </div>
    <div id="transitionOverlay">
        <div class="main-text"></div>
        <div class="sub-text"></div>
    </div>

    <div id="landingPage">
        <div class="landing-content">
            <h1 class="game-title">3D SPACE</h1>
            <h1 class="game-title title-invaders">INVADERS</h1>
            <div class="title-decoration"></div>
            <div class="start-options">
                <div class="start-prompt" id="startNew">NEW GAME</div>
                <div class="continue-prompt" id="continueGame" style="display: none;">
                    CONTINUE FROM LEVEL <span id="savedLevel">2</span>
                </div>
            </div>
            <div class="landing-instructions">
                <div class="instruction-item">
                    <span class="key">MOUSE</span>
                    <span class="action">Move Ship</span>
                </div>
                <div class="instruction-item">
                    <span class="key">CLICK</span>
                    <span class="action">Fire Missile</span>
                </div>
            </div>
            <div class="feature-list">
                <span class="feature">5 ALIEN TYPES</span>
                <span class="feature-divider">•</span>
                <span class="feature">BOSS BATTLES</span>
                <span class="feature-divider">•</span>
                <span class="feature">POWER-UPS</span>
            </div>
        </div>
    </div>

    <script type="module" src="js/main.js"></script>
</body>
</html>
