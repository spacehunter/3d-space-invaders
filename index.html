<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D Space Invaders</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            background: #000;
            font-family: 'Courier New', monospace;
        }
        canvas {
            display: block;
        }
        #ui {
            position: absolute;
            top: 20px;
            left: 20px;
            color: #0f0;
            font-size: 24px;
            text-shadow: 0 0 3px #0f0;
            z-index: 100;
        }
        #gameOver {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: #f00;
            font-size: 48px;
            text-shadow: 0 0 5px #f00;
            display: none;
            text-align: center;
        }
        #instructions {
            position: absolute;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            color: #0ff;
            font-size: 16px;
            text-shadow: 0 0 3px #0ff;
            text-align: center;
        }
        #highscores {
            position: absolute;
            top: 20px;
            right: 20px;
            color: #ffff00;
            font-size: 16px;
            text-shadow: 0 0 3px #ffff00;
            z-index: 100;
            text-align: right;
        }
        #highscores h3 {
            margin: 0 0 10px 0;
            font-size: 20px;
            color: #00ff00;
            text-shadow: 0 0 4px #00ff00;
        }
        #highscores .score-entry {
            margin: 5px 0;
            color: #ffff00;
        }
        #highscores .rank {
            color: #00ffff;
            margin-right: 10px;
        }
        #settings {
            position: absolute;
            bottom: 60px;
            left: 50%;
            transform: translateX(-50%);
            color: #0ff;
            font-size: 14px;
            text-shadow: 0 0 3px #0ff;
            text-align: center;
            z-index: 100;
        }
        #settings label {
            display: block;
            margin-bottom: 5px;
        }
        #glowSlider {
            width: 200px;
            cursor: pointer;
        }
        #fps {
            position: absolute;
            bottom: 10px;
            left: 10px;
            color: #0f0;
            font-size: 14px;
            font-family: monospace;
            z-index: 100;
            pointer-events: none;
        }
    </style>
</head>
<body>
    <div id="fps">FPS: 60</div>
    <div id="ui">
        <div>SCORE: <span id="score">0</span></div>
        <div>LIVES: <span id="lives">3</span></div>
    </div>
    <div id="highscores">
        <h3>HIGH SCORES</h3>
        <div id="highscores-list"></div>
    </div>
    <div id="gameOver">
        <div>GAME OVER</div>
        <div style="font-size: 24px; margin-top: 20px;">Click to Restart</div>
    </div>
    <div id="instructions">
        Move Mouse: Control Ship | Click: Fire Missile
    </div>
    <div id="settings">
        <label for="glowSlider">GLOW INTENSITY: <span id="glowValue">1.50</span></label>
        <input type="range" id="glowSlider" min="0" max="3" step="0.05" value="1.5">
    </div>

    <script type="importmap">
    {
        "imports": {
            "three": "https://cdn.jsdelivr.net/npm/three@0.158.0/build/three.module.js",
            "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.158.0/examples/jsm/"
        }
    }
    </script>

    <script type="module" src="js/main.js"></script>
</body>
</html>
