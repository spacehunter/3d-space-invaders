<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D Space Invaders</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            background: #000;
            font-family: 'Courier New', monospace;
        }
        canvas {
            display: block;
        }
        #ui {
            position: absolute;
            top: 20px;
            left: 20px;
            color: #0f0;
            font-size: 24px;
            text-shadow: 0 0 3px #0f0;
            z-index: 100;
        }
        #gameOver {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: #f00;
            font-size: 48px;
            text-shadow: 0 0 5px #f00;
            display: none;
            text-align: center;
        }
        #instructions {
            position: absolute;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            color: #0ff;
            font-size: 16px;
            text-shadow: 0 0 3px #0ff;
            text-align: center;
        }
        #highscores {
            position: absolute;
            top: 20px;
            right: 20px;
            color: #ffff00;
            font-size: 16px;
            text-shadow: 0 0 3px #ffff00;
            z-index: 100;
            text-align: right;
        }
        #highscores h3 {
            margin: 0 0 10px 0;
            font-size: 20px;
            color: #00ff00;
            text-shadow: 0 0 4px #00ff00;
        }
        #highscores .score-entry {
            margin: 5px 0;
            color: #ffff00;
        }
        #highscores .rank {
            color: #00ffff;
            margin-right: 10px;
        }
        #settings {
            position: absolute;
            bottom: 60px;
            left: 50%;
            transform: translateX(-50%);
            color: #0ff;
            font-size: 14px;
            text-shadow: 0 0 3px #0ff;
            text-align: center;
            z-index: 100;
        }
        #settings label {
            display: block;
            margin-bottom: 5px;
        }
        #glowSlider {
            width: 200px;
            cursor: pointer;
        }
        #fps {
            position: absolute;
            bottom: 10px;
            left: 10px;
            color: #0f0;
            font-size: 14px;
            font-family: monospace;
            z-index: 100;
            pointer-events: none;
        }
        #version {
            position: absolute;
            bottom: 10px;
            right: 10px;
            color: #0f0;
            font-size: 14px;
            font-family: monospace;
            z-index: 100;
            pointer-events: none;
        }
        #levelIndicator {
            position: absolute;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            color: #00ffff;
            font-size: 28px;
            font-weight: bold;
            text-shadow: 0 0 10px #00ffff, 0 0 20px #00ffff;
            z-index: 100;
            letter-spacing: 3px;
            pointer-events: none;
        }
        #bossHealthBar {
            position: absolute;
            top: 70px;
            left: 50%;
            transform: translateX(-50%);
            width: 400px;
            z-index: 100;
            text-align: center;
            pointer-events: none;
        }
        #bossHealthBar .boss-name {
            color: #ff0000;
            font-size: 20px;
            font-weight: bold;
            text-shadow: 0 0 10px #ff0000;
            margin-bottom: 8px;
            animation: bossNamePulse 1s ease-in-out infinite;
        }
        @keyframes bossNamePulse {
            0%, 100% { text-shadow: 0 0 10px #ff0000; }
            50% { text-shadow: 0 0 20px #ff0000, 0 0 30px #ff4444; }
        }
        #bossHealthBar .health-bar-container {
            width: 100%;
            height: 16px;
            background: rgba(0, 0, 0, 0.8);
            border: 2px solid #ff0000;
            border-radius: 8px;
            overflow: hidden;
            position: relative;
            box-shadow: 0 0 10px rgba(255, 0, 0, 0.5);
        }
        #bossHealthBar .health-bar-fill {
            height: 100%;
            background: linear-gradient(90deg, #00ff00, #88ff88);
            transition: width 0.3s ease-out;
            box-shadow: 0 0 10px currentColor inset;
        }
        /* Level transition overlay */
        #transitionOverlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: none;
            justify-content: flex-start;
            align-items: center;
            flex-direction: column;
            padding-top: 18%;
            z-index: 200;
            pointer-events: none;
            background: transparent;
        }
        #transitionOverlay.active {
            display: flex;
        }
        #transitionOverlay .main-text {
            font-size: 72px;
            font-weight: bold;
            text-align: center;
            letter-spacing: 8px;
            opacity: 0;
            transform: scale(0.5);
            transition: all 0.5s ease-out;
        }
        #transitionOverlay .main-text.show {
            opacity: 1;
            transform: scale(1);
        }
        #transitionOverlay .sub-text {
            font-size: 36px;
            text-align: center;
            letter-spacing: 4px;
            margin-top: 20px;
            opacity: 0;
            transition: all 0.4s ease-out 0.2s;
        }
        #transitionOverlay .sub-text.show {
            opacity: 1;
        }
        .text-green {
            color: #00ff00;
            text-shadow: 0 0 20px #00ff00, 0 0 40px #00ff00, 0 0 60px #00ff00;
        }
        .text-yellow {
            color: #ffff00;
            text-shadow: 0 0 20px #ffff00, 0 0 40px #ffff00, 0 0 60px #ffff00;
        }
        .text-cyan {
            color: #00ffff;
            text-shadow: 0 0 20px #00ffff, 0 0 40px #00ffff, 0 0 60px #00ffff;
        }
        .text-red {
            color: #ff0000;
            text-shadow: 0 0 20px #ff0000, 0 0 40px #ff0000, 0 0 60px #ff0000;
            animation: bossTextPulse 0.5s ease-in-out infinite;
        }
        .text-magenta {
            color: #ff00ff;
            text-shadow: 0 0 20px #ff00ff, 0 0 40px #ff00ff, 0 0 60px #ff00ff;
        }
        @keyframes bossTextPulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.05); }
        }
        /* Weapon HUD */
        #weaponHUD {
            position: absolute;
            bottom: 100px;
            left: 20px;
            color: #00ffff;
            font-size: 16px;
            text-shadow: 0 0 5px #00ffff;
            z-index: 100;
            pointer-events: none;
        }
        #weaponHUD .current-weapon {
            font-size: 20px;
            font-weight: bold;
            margin-bottom: 5px;
        }
        #weaponHUD .weapon-key {
            color: #ffff00;
            font-size: 14px;
        }
        #weaponHUD .next-unlock {
            margin-top: 10px;
            font-size: 14px;
            color: #888888;
        }
        #weaponHUD .next-unlock .weapon-name {
            color: #ff8800;
        }
        #weaponHUD .unlock-progress {
            width: 120px;
            height: 4px;
            background: #333333;
            margin-top: 4px;
            border-radius: 2px;
            overflow: hidden;
        }
        #weaponHUD .unlock-progress-fill {
            height: 100%;
            background: linear-gradient(90deg, #ff8800, #ffaa00);
            transition: width 0.3s ease-out;
        }
        /* Weapon unlock overlay */
        #weaponUnlock {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 250;
            pointer-events: none;
            background: rgba(0, 0, 0, 0.3);
        }
        #weaponUnlock.active {
            display: flex;
        }
        #weaponUnlock .unlock-content {
            text-align: center;
            animation: unlockPulse 0.5s ease-out;
        }
        @keyframes unlockPulse {
            0% { transform: scale(0.5); opacity: 0; }
            50% { transform: scale(1.1); }
            100% { transform: scale(1); opacity: 1; }
        }
        #weaponUnlock .unlock-star {
            font-size: 60px;
            color: #ffff00;
            text-shadow: 0 0 30px #ffff00, 0 0 60px #ffff00;
            animation: starSpin 1s ease-out;
        }
        @keyframes starSpin {
            0% { transform: rotate(0deg) scale(0); }
            50% { transform: rotate(180deg) scale(1.2); }
            100% { transform: rotate(360deg) scale(1); }
        }
        #weaponUnlock .unlock-title {
            font-size: 36px;
            font-weight: bold;
            color: #00ff00;
            text-shadow: 0 0 20px #00ff00, 0 0 40px #00ff00;
            margin: 10px 0;
            letter-spacing: 3px;
        }
        #weaponUnlock .unlock-name {
            font-size: 48px;
            font-weight: bold;
            color: #00ffff;
            text-shadow: 0 0 20px #00ffff, 0 0 40px #00ffff;
            margin: 10px 0;
        }
        #weaponUnlock .unlock-tagline {
            font-size: 24px;
            color: #ffff00;
            font-style: italic;
            margin: 10px 0;
        }
        #weaponUnlock .unlock-hint {
            font-size: 18px;
            color: #888888;
            margin-top: 20px;
        }
        /* Combo notification */
        #comboNotify {
            position: absolute;
            top: 120px;
            left: 20px;
            padding: 8px 16px;
            background: rgba(0, 0, 0, 0.7);
            border: 2px solid #ff8800;
            border-radius: 8px;
            color: #ffff00;
            font-size: 16px;
            font-weight: bold;
            text-shadow: 0 0 5px #ffff00;
            z-index: 100;
            pointer-events: none;
            display: none;
            animation: comboSlideIn 0.3s ease-out;
        }
        @keyframes comboSlideIn {
            0% { transform: translateX(-100px); opacity: 0; }
            100% { transform: translateX(0); opacity: 1; }
        }
        #comboNotify.active {
            display: block;
        }
    </style>
</head>
<body>
    <div id="fps">FPS: 60</div>
    <div id="version"></div>
    <div id="levelIndicator">LEVEL 1</div>
    <div id="ui">
        <div>SCORE: <span id="score">0</span></div>
        <div>LIVES: <span id="lives">3</span></div>
    </div>
    <div id="highscores">
        <h3>HIGH SCORES</h3>
        <div id="highscores-list"></div>
    </div>
    <div id="gameOver">
        <div>GAME OVER</div>
        <div style="font-size: 24px; margin-top: 20px;">Click to Restart</div>
    </div>
    <div id="instructions">
        Move Mouse: Control Ship | Click: Fire | 1-7/Q/E/Scroll: Switch Weapon
    </div>
    <div id="weaponHUD">
        <div class="current-weapon" id="currentWeaponName">Pulse Cannon</div>
        <div class="weapon-key">[<span id="currentWeaponKey">1</span>]</div>
        <div class="next-unlock" id="nextUnlockInfo">
            Next: <span class="weapon-name" id="nextWeaponName">Twin Blasters</span>
            <div class="unlock-progress">
                <div class="unlock-progress-fill" id="unlockProgressFill" style="width: 0%"></div>
            </div>
        </div>
    </div>
    <div id="weaponUnlock">
        <div class="unlock-content">
            <div class="unlock-star">&#9733;</div>
            <div class="unlock-title">NEW WEAPON UNLOCKED</div>
            <div class="unlock-name" id="unlockedWeaponName"></div>
            <div class="unlock-tagline" id="unlockedWeaponTagline"></div>
            <div class="unlock-hint">Press [<span id="unlockedWeaponKey"></span>] to equip</div>
        </div>
    </div>
    <div id="comboNotify"></div>
    <div id="settings">
        <label for="glowSlider">GLOW INTENSITY: <span id="glowValue">1.50</span></label>
        <input type="range" id="glowSlider" min="0" max="3" step="0.05" value="1.5">
    </div>
    <div id="transitionOverlay">
        <div class="main-text"></div>
        <div class="sub-text"></div>
    </div>

    <script type="module" src="js/main.js"></script>
</body>
</html>
