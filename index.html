<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D Space Invaders</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            background: #000;
            font-family: 'Courier New', monospace;
        }
        canvas {
            display: block;
        }
        #ui {
            position: absolute;
            top: 20px;
            left: 20px;
            color: #0f0;
            font-size: 24px;
            text-shadow: 0 0 3px #0f0;
            z-index: 100;
        }
        #gameOver {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: #f00;
            font-size: 48px;
            text-shadow: 0 0 5px #f00;
            display: none;
            text-align: center;
        }
        #instructions {
            position: absolute;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            color: #0ff;
            font-size: 16px;
            text-shadow: 0 0 3px #0ff;
            text-align: center;
        }
        #highscores {
            position: absolute;
            top: 20px;
            right: 20px;
            color: #ffff00;
            font-size: 16px;
            text-shadow: 0 0 3px #ffff00;
            z-index: 100;
            text-align: right;
        }
        #highscores h3 {
            margin: 0 0 10px 0;
            font-size: 20px;
            color: #00ff00;
            text-shadow: 0 0 4px #00ff00;
        }
        #highscores .score-entry {
            margin: 5px 0;
            color: #ffff00;
        }
        #highscores .rank {
            color: #00ffff;
            margin-right: 10px;
        }
        #settings {
            position: absolute;
            bottom: 60px;
            left: 50%;
            transform: translateX(-50%);
            color: #0ff;
            font-size: 14px;
            text-shadow: 0 0 3px #0ff;
            text-align: center;
            z-index: 100;
        }
        #settings label {
            display: block;
            margin-bottom: 5px;
        }
        #glowSlider {
            width: 200px;
            cursor: pointer;
        }
        #fps {
            position: absolute;
            bottom: 10px;
            left: 10px;
            color: #0f0;
            font-size: 14px;
            font-family: monospace;
            z-index: 100;
            pointer-events: none;
        }
        #version {
            position: absolute;
            bottom: 10px;
            right: 10px;
            color: #0f0;
            font-size: 14px;
            font-family: monospace;
            z-index: 100;
            pointer-events: none;
        }
        #levelIndicator {
            position: absolute;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            color: #00ffff;
            font-size: 28px;
            font-weight: bold;
            text-shadow: 0 0 10px #00ffff, 0 0 20px #00ffff;
            z-index: 100;
            letter-spacing: 3px;
            pointer-events: none;
        }
        #bossHealthBar {
            position: absolute;
            top: 70px;
            left: 50%;
            transform: translateX(-50%);
            width: 400px;
            z-index: 100;
            text-align: center;
            pointer-events: none;
        }
        #bossHealthBar .boss-name {
            color: #ff0000;
            font-size: 20px;
            font-weight: bold;
            text-shadow: 0 0 10px #ff0000;
            margin-bottom: 8px;
            animation: bossNamePulse 1s ease-in-out infinite;
        }
        @keyframes bossNamePulse {
            0%, 100% { text-shadow: 0 0 10px #ff0000; }
            50% { text-shadow: 0 0 20px #ff0000, 0 0 30px #ff4444; }
        }
        #bossHealthBar .health-bar-container {
            width: 100%;
            height: 16px;
            background: rgba(0, 0, 0, 0.8);
            border: 2px solid #ff0000;
            border-radius: 8px;
            overflow: hidden;
            position: relative;
            box-shadow: 0 0 10px rgba(255, 0, 0, 0.5);
        }
        #bossHealthBar .health-bar-fill {
            height: 100%;
            background: linear-gradient(90deg, #00ff00, #88ff88);
            transition: width 0.3s ease-out;
            box-shadow: 0 0 10px currentColor inset;
        }
    </style>
</head>
<body>
    <div id="fps">FPS: 60</div>
    <div id="version"></div>
    <div id="levelIndicator">LEVEL 1</div>
    <div id="ui">
        <div>SCORE: <span id="score">0</span></div>
        <div>LIVES: <span id="lives">3</span></div>
    </div>
    <div id="highscores">
        <h3>HIGH SCORES</h3>
        <div id="highscores-list"></div>
    </div>
    <div id="gameOver">
        <div>GAME OVER</div>
        <div style="font-size: 24px; margin-top: 20px;">Click to Restart</div>
    </div>
    <div id="instructions">
        Move Mouse: Control Ship | Click: Fire Missile
    </div>
    <div id="settings">
        <label for="glowSlider">GLOW INTENSITY: <span id="glowValue">1.50</span></label>
        <input type="range" id="glowSlider" min="0" max="3" step="0.05" value="1.5">
    </div>

    <script type="module" src="js/main.js"></script>
</body>
</html>
