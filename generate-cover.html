<!DOCTYPE html>
<html>
<head>
    <title>Generate Cover Image</title>
    <style>
        body {
            background: #111;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            font-family: monospace;
            color: white;
        }
        canvas {
            border: 2px solid #333;
        }
        .instructions {
            margin-top: 20px;
            text-align: center;
        }
        button {
            background: #00ff00;
            color: black;
            border: none;
            padding: 10px 20px;
            font-family: monospace;
            font-size: 16px;
            cursor: pointer;
            margin-top: 10px;
        }
        button:hover {
            background: #00cc00;
        }
    </style>
</head>
<body>
    <canvas id="cover" width="630" height="500"></canvas>
    <div class="instructions">
        <p>Cover Image (630x500) - Recommended for itch.io</p>
        <button onclick="downloadImage()">Download PNG</button>
    </div>

    <script>
        const canvas = document.getElementById('cover');
        const ctx = canvas.getContext('2d');

        // Colors from the game
        const colors = {
            player: '#00ff00',
            playerDark: '#00aa00',
            cockpit: '#00ffff',
            engine: '#ff8800',
            barrier: '#00ff00',
            barrierDark: '#009900',
            octopus: '#ff00ff',
            crab: '#ff0000',
            squid: '#00ff00',
            ufo: '#ffff00',
            tank: '#00ffff',
            beetle: '#ff8800',
            invader: '#ffffff',
            missile: '#ffff00',
            bonusUfo: '#ff00ff'
        };

        function drawGlow(x, y, width, height, color, glowSize = 10) {
            ctx.shadowColor = color;
            ctx.shadowBlur = glowSize;
            ctx.fillStyle = color;
            ctx.fillRect(x, y, width, height);
            ctx.shadowBlur = 0;
        }

        function drawStars() {
            // Dark space background - pure black like the game
            ctx.fillStyle = '#000000';
            ctx.fillRect(0, 0, 630, 500);

            // Stars - various sizes
            for (let i = 0; i < 120; i++) {
                const x = Math.random() * 630;
                const y = Math.random() * 500;
                const size = Math.random() * 2 + 0.5;
                const brightness = Math.random() * 155 + 100;
                ctx.fillStyle = `rgb(${brightness}, ${brightness}, ${brightness})`;
                ctx.beginPath();
                ctx.arc(x, y, size, 0, Math.PI * 2);
                ctx.fill();
            }
        }

        // Draw player ship from behind (3rd person view) - large in foreground
        function drawPlayerShip3D(x, y, scale = 1) {
            const s = scale;

            // Main body (green)
            ctx.shadowColor = colors.player;
            ctx.shadowBlur = 25 * s;
            ctx.fillStyle = colors.player;
            ctx.fillRect(x - 40*s, y - 30*s, 80*s, 50*s);

            // Darker wing extensions
            ctx.fillStyle = colors.playerDark;
            ctx.shadowColor = colors.playerDark;
            ctx.shadowBlur = 15 * s;
            ctx.fillRect(x - 70*s, y - 15*s, 30*s, 35*s);
            ctx.fillRect(x + 40*s, y - 15*s, 30*s, 35*s);

            // Cockpit windows (two cyan squares like in screenshot)
            ctx.shadowColor = colors.cockpit;
            ctx.shadowBlur = 20 * s;
            ctx.fillStyle = colors.cockpit;
            ctx.fillRect(x - 25*s, y - 25*s, 20*s, 18*s);
            ctx.fillRect(x + 5*s, y - 25*s, 20*s, 18*s);

            // Engine thruster glow (orange/yellow at back)
            ctx.shadowColor = colors.engine;
            ctx.shadowBlur = 30 * s;
            ctx.fillStyle = colors.engine;
            ctx.fillRect(x - 25*s, y + 15*s, 15*s, 25*s);
            ctx.fillRect(x + 10*s, y + 15*s, 15*s, 25*s);

            // Engine glow bloom
            ctx.shadowBlur = 40 * s;
            ctx.globalAlpha = 0.5;
            ctx.fillRect(x - 30*s, y + 30*s, 25*s, 35*s);
            ctx.fillRect(x + 5*s, y + 30*s, 25*s, 35*s);
            ctx.globalAlpha = 1;
            ctx.shadowBlur = 0;
        }

        // Draw barrier (voxel style arch)
        function drawBarrier(x, y, scale = 1) {
            const s = 6 * scale;
            ctx.shadowColor = colors.barrier;
            ctx.shadowBlur = 12;
            ctx.fillStyle = colors.barrier;

            // Arch shape - blocky
            // Top row
            for (let i = 0; i < 5; i++) {
                ctx.fillRect(x - s*2.5 + i*s, y - s*2, s*0.9, s*0.9);
            }
            // Second row
            for (let i = 0; i < 6; i++) {
                ctx.fillRect(x - s*3 + i*s, y - s, s*0.9, s*0.9);
            }
            // Third row with gap
            ctx.fillRect(x - s*3, y, s*0.9, s*0.9);
            ctx.fillRect(x - s*2, y, s*0.9, s*0.9);
            ctx.fillRect(x + s*1, y, s*0.9, s*0.9);
            ctx.fillRect(x + s*2, y, s*0.9, s*0.9);
            // Bottom legs
            ctx.fillRect(x - s*3, y + s, s*0.9, s*0.9);
            ctx.fillRect(x + s*2, y + s, s*0.9, s*0.9);

            ctx.shadowBlur = 0;
        }

        // Draw small alien (for distant formation)
        function drawSmallAlien(x, y, type, scale = 1) {
            const s = 3 * scale;
            ctx.shadowBlur = 8;

            switch(type) {
                case 0: // Octopus - magenta
                    ctx.shadowColor = colors.octopus;
                    ctx.fillStyle = colors.octopus;
                    ctx.fillRect(x - s*1.5, y - s, s*3, s*2);
                    ctx.fillStyle = '#ffff00';
                    ctx.fillRect(x - s*0.5, y - s*0.3, s*0.4, s*0.4);
                    ctx.fillRect(x + s*0.2, y - s*0.3, s*0.4, s*0.4);
                    break;
                case 1: // Crab - red
                    ctx.shadowColor = colors.crab;
                    ctx.fillStyle = colors.crab;
                    ctx.fillRect(x - s*1.5, y - s*0.5, s*3, s*1.5);
                    ctx.fillStyle = '#00ffff';
                    ctx.fillRect(x - s*0.5, y - s*0.8, s*0.3, s*0.3);
                    ctx.fillRect(x + s*0.3, y - s*0.8, s*0.3, s*0.3);
                    break;
                case 2: // Squid - green
                    ctx.shadowColor = colors.squid;
                    ctx.fillStyle = colors.squid;
                    ctx.fillRect(x - s, y - s*1.2, s*2, s*2);
                    ctx.fillStyle = '#ff0000';
                    ctx.fillRect(x - s*0.4, y - s*0.5, s*0.3, s*0.3);
                    ctx.fillRect(x + s*0.2, y - s*0.5, s*0.3, s*0.3);
                    break;
                case 3: // UFO - yellow
                    ctx.shadowColor = colors.ufo;
                    ctx.fillStyle = colors.ufo;
                    ctx.fillRect(x - s*1.5, y - s*0.3, s*3, s*0.8);
                    ctx.fillRect(x - s, y - s*0.8, s*2, s*0.6);
                    break;
                case 4: // Tank - cyan
                    ctx.shadowColor = colors.tank;
                    ctx.fillStyle = colors.tank;
                    ctx.fillRect(x - s*1.2, y - s*0.5, s*2.4, s*1.2);
                    ctx.fillRect(x - s*0.2, y - s*1.2, s*0.4, s*0.8);
                    break;
                case 5: // Beetle - orange
                    ctx.shadowColor = colors.beetle;
                    ctx.fillStyle = colors.beetle;
                    ctx.fillRect(x - s*1.2, y - s*0.5, s*2.4, s*1.2);
                    ctx.fillStyle = '#ffff00';
                    ctx.fillRect(x - s*0.3, y - s*1, s*0.2, s*0.2);
                    ctx.fillRect(x + s*0.2, y - s*1, s*0.2, s*0.2);
                    break;
                case 6: // Invader - white
                    ctx.shadowColor = colors.invader;
                    ctx.fillStyle = colors.invader;
                    ctx.fillRect(x - s*1.2, y - s*0.5, s*2.4, s*1);
                    ctx.fillStyle = '#00ffff';
                    ctx.fillRect(x - s*0.4, y - s*0.3, s*0.3, s*0.2);
                    ctx.fillRect(x + s*0.2, y - s*0.3, s*0.3, s*0.2);
                    break;
            }
            ctx.shadowBlur = 0;
        }

        // Draw bonus UFO
        function drawBonusUFO(x, y, scale = 1) {
            const s = 8 * scale;

            // Main body - magenta/pink
            ctx.shadowColor = colors.bonusUfo;
            ctx.shadowBlur = 20;
            ctx.fillStyle = colors.bonusUfo;
            ctx.fillRect(x - s*2, y, s*4, s*1);
            ctx.fillRect(x - s*1.5, y - s*0.6, s*3, s*0.8);

            // Top light - red/orange
            ctx.shadowColor = '#ff3300';
            ctx.shadowBlur = 15;
            ctx.fillStyle = '#ff3300';
            ctx.fillRect(x - s*0.3, y - s*1.2, s*0.6, s*0.6);

            ctx.shadowBlur = 0;
        }

        // Draw missile
        function drawMissile(x, y, scale = 1) {
            const s = scale;

            // Yellow missile body
            ctx.shadowColor = colors.missile;
            ctx.shadowBlur = 15;
            ctx.fillStyle = colors.missile;
            ctx.fillRect(x - 3*s, y, 6*s, 20*s);

            // Orange trail
            ctx.shadowColor = '#ff8800';
            ctx.globalAlpha = 0.7;
            ctx.fillStyle = '#ff8800';
            ctx.fillRect(x - 2*s, y + 20*s, 4*s, 15*s);
            ctx.globalAlpha = 0.4;
            ctx.fillRect(x - 1.5*s, y + 35*s, 3*s, 10*s);
            ctx.globalAlpha = 1;
            ctx.shadowBlur = 0;
        }

        function drawTitle() {
            // Main title with strong glow
            ctx.font = 'bold 48px monospace';
            ctx.textAlign = 'center';

            // Glow layers
            ctx.shadowColor = '#00ffff';
            ctx.shadowBlur = 25;
            ctx.fillStyle = '#00ffff';
            ctx.fillText('3D SPACE', 315, 60);

            ctx.shadowColor = '#ff00ff';
            ctx.shadowBlur = 25;
            ctx.fillStyle = '#ff00ff';
            ctx.fillText('INVADERS', 315, 108);

            // Inner bright text
            ctx.shadowBlur = 0;
            ctx.fillStyle = '#ffffff';
            ctx.fillText('3D SPACE', 315, 60);
            ctx.fillText('INVADERS', 315, 108);

            ctx.shadowBlur = 0;
        }

        function drawCover() {
            // Background with stars
            drawStars();

            // Title at top
            drawTitle();

            // Bonus UFO flying at top
            drawBonusUFO(315, 135, 1.2);

            // Alien formation in distance (3D perspective - smaller at back)
            // 7 rows of aliens, getting smaller toward back
            const alienRows = 7;
            const baseY = 165;
            const rowHeight = 22;

            for (let row = 0; row < alienRows; row++) {
                // Perspective: back rows are smaller and more centered
                const perspective = 1 - row * 0.08;
                const cols = 11;
                const spacing = 45 * perspective;
                const startX = 315 - (cols - 1) * spacing / 2;
                const y = baseY + row * rowHeight * perspective;
                const alienType = alienRows - 1 - row; // Reverse order (front row is type 0)

                for (let col = 0; col < cols; col++) {
                    const x = startX + col * spacing;
                    drawSmallAlien(x, y, alienType, perspective * 0.9);
                }
            }

            // Four barriers in middle ground
            const barrierY = 330;
            const barrierSpacing = 140;
            for (let i = 0; i < 4; i++) {
                const x = 100 + i * barrierSpacing;
                drawBarrier(x, barrierY, 1.3);
            }

            // Player ship - large in foreground (3rd person view from behind)
            drawPlayerShip3D(315, 420, 1.4);

            // Missiles in flight
            drawMissile(250, 280, 1);
            drawMissile(380, 260, 1);
            drawMissile(315, 300, 1);

            // Scanlines effect (very subtle)
            ctx.fillStyle = 'rgba(0, 0, 0, 0.02)';
            for (let i = 0; i < 500; i += 2) {
                ctx.fillRect(0, i, 630, 1);
            }

            // Subtle vignette
            const vignette = ctx.createRadialGradient(315, 280, 150, 315, 280, 400);
            vignette.addColorStop(0, 'rgba(0,0,0,0)');
            vignette.addColorStop(1, 'rgba(0,0,0,0.4)');
            ctx.fillStyle = vignette;
            ctx.fillRect(0, 0, 630, 500);
        }

        function downloadImage() {
            const link = document.createElement('a');
            link.download = 'cover-630x500.png';
            link.href = canvas.toDataURL('image/png');
            link.click();
        }

        // Draw on load
        drawCover();
    </script>
</body>
</html>
