<!DOCTYPE html>
<html lang="en"><head>
<meta charset="utf-8">
<title>Scorpion Preview</title>
<style>*{margin:0;padding:0;box-sizing:border-box}
body{overflow:hidden;background:#1a1a2e;font-family:monospace;user-select:none}
#ui{position:fixed;top:12px;left:50%;transform:translateX(-50%);display:flex;gap:5px;z-index:10;background:rgba(0,0,0,0.4);padding:5px 8px;border-radius:6px}
#ui button{background:#2a2a3e;color:#ccc;border:1px solid #555;padding:4px 10px;cursor:pointer;font-family:monospace;font-size:11px;border-radius:3px;border:none}
#ui button.on{background:#1656c8;color:#fff;font-weight:bold}
#ui button:hover{background:#444}
#ui button.on:hover{background:#10469c}
#bar{position:fixed;top:44px;left:50%;transform:translateX(-50%);color:#aaa;font-size:11px;background:rgba(0,0,0,0.5);padding:3px 10px;border-radius:3px;z-index:10}
#msg{position:fixed;bottom:10px;left:50%;transform:translateX(-50%);color:#666;font-size:10px;background:rgba(0,0,0,0.4);padding:3px 8px;border-radius:3px;z-index:10;text-align:center}
</style></head><body>
<div id="ui"><button class="on">Reset View</button><button id="shotBtn">Screenshot</button></div>
<div id="bar">Scorpion — Row 7 — Drag to rotate · Scroll to zoom</div>
<div id="msg">Click button or press S to screenshot · Press R to reset view</div>

<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.158.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.158.0/examples/jsm/"}}</script>
<script type="module">
import*as THREE from'three'
import{OrbitControls}from'three/addons/controls/OrbitControls.js'
import{EffectComposer}from'three/addons/postprocessing/EffectComposer.js'
import{RenderPass}from'three/addons/postprocessing/RenderPass.js'
import{UnrealBloomPass}from'three/addons/postprocessing/UnrealBloomPass.js'
import{mergeGeometries}from'three/addons/utils/mergeGeometries.js'

// Voxel helpers
function bGeo(boxes){return boxes.map(b=>{const g=new THREE.BoxGeometry(b.size[0],b.size[1],b.size[2]);if(b.rotX)g.rotateX(b.rotX);if(b.rotY)g.rotateY(b.rotY);if(b.rotZ)g.rotateZ(b.rotZ);if(b.pos)g.translate(b.pos[0],b.pos[1],b.pos[2]);const c=new THREE.Color(b.color);const v=g.attributes.position.count,cl=new Float32Array(v*3);for(let i=0;i<v;i++){cl[i*3]=c.r;cl[i*3+1]=c.g;cl[i*3+2]=c.b}g.setAttribute('color',new THREE.Float32BufferAttribute(cl,3));return g})}
function bVox(boxes){return boxes.length===1?bGeo(boxes)[0]:mergeGeometries(bGeo(boxes))}
function limbSeg(s,c1,c2){return bVox([{size:[s.width,s.length,s.width],pos:[0,-s.length/2,0],color:c1},{size:[s.width+0.05,0.07,s.width+0.05],pos:[0,-0.02,0],color:c2||c1}])}
function limbChain(mount,geos,segs,mat){const chain=[];let p=mount;segs.forEach((s,j)=>{const m=new THREE.Mesh(geos[j],mat);m.position.y=j===0?0:-segs[j-1].length;m.rotation.z=s.baseBend;m.userData.baseBend=s.baseBend;p.add(m);p=m;chain.push(m)});return chain}

// Tail segment: extends along +Z axis
function tailSeg(w,h,l,c1,c2){return bVox([{size:[w,h,l],pos:[0,0,-l/2],color:c1},{size:[w+0.03,0.035,l+0.03],pos:[0,0,0],color:c2||c1}])}
function tailChain(mount,geos,segs,mat){const chain=[];let p=mount;segs.forEach((s,j)=>{const m=new THREE.Mesh(geos[j],mat);m.position.z=j===0?0:segs[j-1].len;m.rotation.z=s.bend;m.userData.baseBend=s.bend;p.add(m);p=m;chain.push(m)});return chain}

// Scorpion constants
const LEG_SEGS=[{length:0.22,width:0.10,baseBend:0.95},{length:0.18,width:0.08,baseBend:-1.40},{length:0.12,width:0.06,baseBend:-0.30}]
const LEG_CFG=[{side:-1,z:0.34,phase:0},{side:-1,z:0.12,phase:Math.PI},{side:-1,z:-0.08,phase:0},{side:-1,z:-0.26,phase:Math.PI},{side:1,z:0.34,phase:0},{side:1,z:0.12,phase:Math.PI},{side:1,z:-0.08,phase:0},{side:1,z:-0.26,phase:Math.PI}]
const TL_SEGS=[{len:0.30,w:0.16,bend:0},{len:0.26,w:0.13,bend:0.22},{len:0.22,w:0.11,bend:0.30},{len:0.18,w:0.09,bend:-0.05}]

// Make the scorpion model
function makeScorpion(){
 const g=new THREE.Group()
 // Body
 const bodyGeo=bVox([
  {size:[0.86,0.10,0.94],pos:[0,-0.11,-0.08],color:0x5a3c1a},
  {size:[0.82,0.08,0.82],pos:[0,-0.06,-0.06],color:0x6e4a24},
  {size:[0.78,0.06,0.70],pos:[0,-0.03,-0.04],color:0x82582e},
  {size:[0.22,0.10,0.20],pos:[-0.44,-0.06,0.18],color:0x5a3c1a},
  {size:[0.22,0.10,0.20],pos:[0.44,-0.06,0.18],color:0x5a3c1a},
  {size:[0.68,0.14,0.24],pos:[0,0.02,0.36],color:0x3e2a12},
  {size:[0.56,0.05,0.14],pos:[0,0.06,0.34],color:0x523818},
  {size:[0.34,0.08,0.12],pos:[0,-0.02,0.46],color:0x2a1c0c},
  {size:[0.08,0.06,0.08],pos:[-0.48,-0.04,-0.20],color:0x6e4a24},
  {size:[0.08,0.06,0.08],pos:[0.48,-0.04,-0.20],color:0x6e4a24},
  {size:[0.08,0.06,0.08],pos:[-0.48,-0.02,-0.26],color:0x523818},
  {size:[0.08,0.06,0.08],pos:[0.48,-0.02,-0.26],color:0x523818},
  {size:[0.08,0.06,0.08],pos:[-0.44,0.00,-0.32],color:0x3e2a12},
  {size:[0.08,0.06,0.08],pos:[0.44,0.00,-0.32],color:0x3e2a12}
 ])
 const body=new THREE.Mesh(bodyGeo,new THREE.MeshPhongMaterial({vertexColors:true,emissive:0x3a2210,emissiveIntensity:0.85,shininess:25,flatShading:true}))
 body.castShadow=true
 g.add(body)
 // Head
 g.add(new THREE.Mesh(bVox([
  {size:[0.30,0.08,0.18],pos:[0,0.04,0.38],color:0x1a120c},
  {size:[0.12,0.06,0.06],pos:[-0.12,0.05,0.44],color:0x2a2012},
  {size:[0.12,0.06,0.06],pos:[0.12,0.05,0.44],color:0x2a2012},
  {size:[0.09,0.04,0.04],pos:[-0.12,0.05,0.455],color:0x4a3c24},
  {size:[0.09,0.04,0.04],pos:[0.12,0.05,0.455],color:0x4a3c24}
 ]),new THREE.MeshPhongMaterial({vertexColors:true,emissive:0x1a0e06,emissiveIntensity:0.6,flatShading:true})))
 // Tail
 const tlPiv=new THREE.Group()
 tlPiv.position.set(0,0.04,-0.30)
 g.add(tlPiv)
 const tlGeos=TL_SEGS.map(s=>tailSeg(s.w,0.12,s.len,0x9e6a28,0x5a3c1a))
 const tlCh=tailChain(tlPiv,tlGeos,TL_SEGS,new THREE.MeshPhongMaterial({vertexColors:true,emissive:0x624218,emissiveIntensity:0.8,flatShading:true}))
 const stinger=new THREE.Mesh(bVox([
  {size:[0.08,0.08,0.16],pos:[0,0,-0.28],color:0x2a1c0c},
  {size:[0.06,0.06,0.08],pos:[0,0,-0.48],color:0xffd000},
  {size:[0.04,0.04,0.04],pos:[0,0,-0.60],color:0xffd800}
 ]),new THREE.MeshPhongMaterial({vertexColors:true,emissive:0xffd800,emissiveIntensity:1.5,flatShading:true}))
 stinger.position.z=-TL_SEGS[3].len-0.02
 tlCh[3].add(stinger)
 // Pincers
 const pMat=new THREE.MeshPhongMaterial({vertexColors:true,emissive:0x624218,emissiveIntensity:1.0,flatShading:true})
 g.userData.pincers=[-1,1].map(side=>{
  const piv=new THREE.Group()
  piv.position.set(side*0.44,0.04,0.30)
  piv.rotation.y=-side*0.25
  g.add(piv)
  const arm=piv.add(new THREE.Mesh(bVox([
   {size:[0.20,0.10,0.20],pos:[0,0,0.05],color:0x5a3c1a},
   {size:[0.14,0.08,0.16],pos:[0,0.02,0.17],color:0x6e4a24},
   {size:[0.12,0.06,0.16],pos:[0,0.00,0.30],color:0x82582e},
   {size:[0.10,0.05,0.10],pos:[0,0,0.42],color:0x6e4a24},
   {size:[0.08,0.04,0.16],pos:[0,0,0.54],color:0x82582e}
  ]),pMat))
  arm.position.z=0.10
  arm.rotation.x=-0.35
  const jw=piv.add(new THREE.Mesh(bVox([{size:[0.08,0.14,0.14],pos:[0,-0.05,0.46],color:0x6e4a24}]),pMat))
  jw.rotation.x=0.35
  return{pivot:piv,arm:arm,jaw:jw,side:side}
 })
 // 8 legs
 const legGeos=LEG_SEGS.map(s=>limbSeg(s,0x8a6030,0x4a2e14))
 g.userData.legs=LEG_CFG.map(c=>{
  const lm=new THREE.Group()
  lm.position.set(c.side*0.50,-0.08,c.z)
  lm.rotation.y=c.side>0?0:Math.PI
  g.add(lm)
  const segs=limbChain(lm,legGeos,LEG_SEGS,new THREE.MeshPhongMaterial({vertexColors:true,emissive:0x3a2210,emissiveIntensity:0.7,flatShading:true}))
  return{mount:lm,segs:segs,phase:c.phase,side:c.side}
 })
 // Store refs
 g.userData.body=body
 g.userData.tailPivot=tlPiv
 g.userData.tailChain=tlCh
 g.userData.stinger=stinger
 return g
}

// Animation
function animScorpion(s){
 if(!s.userData.animOffset)s.userData.animOffset=Math.random()*Math.PI*2
 const t=s.userData.animOffset+Date.now()*0.001
 const fp=(t%2.8)/2.8
 const flash=fp<0.05?Math.sin((fp/0.05)*Math.PI):0
 const recoil=fp<0.015?Math.min(1,fp/0.015):Math.max(0,1-(fp-0.015)/0.14)
 const charge=Math.max(0,(fp-0.08)/0.92)
 const u=s.userData
 // Tail
 if(u.tailPivot){u.tailPivot.rotation.z=Math.cos(t*4)*0.06+Math.max(0,recoil)*0.35}
 if(u.tailChain){u.tailChain.forEach((seg,i)=>{const bk=Math.max(0,recoil)*0.3*(1+i*0.35)+Math.sin(t*1.5+i*0.7)*0.03;const bb=seg.userData.baseBend;seg.rotation.z=(bb||0)-bk;seg.rotation.x=Math.cos(t*2+i)*0.04})}
 // Stinger
 if(u.stinger){u.stinger.material.emissiveIntensity=1.4+charge*4.0+flash*3.5;const sv=1+flash*0.4;u.stinger.scale.set(sv,sv,sv)}
 // Pincers
 if(u.pincers){u.pincers.forEach((p,i)=>{const op=charge*0.15+flash*0.25;p.pivot.rotation.z=p.side*(Math.sin(t*1.8+i*2.1)*0.08+op);p.jaw.rotation.x=0.35+op*0.3;p.arm.rotation.x=-0.35-op*0.15})}
 // Legs
 if(u.legs){u.legs.forEach(l=>{const st=Math.sin(t*10+l.phase);const lf=Math.max(0,st);l.segs[0].rotation.z=(l.segs[0].userData.baseBend||0.95)-lf*0.25;l.segs[0].rotation.x=Math.cos(t*10+l.phase)*0.22;l.segs[1].rotation.z=(l.segs[1].userData.baseBend||-1.40)+lf*0.35;l.segs[2].rotation.z=(l.segs[2].userData.baseBend||-0.30)+lf*0.15})}
 // Body
 if(u.body){u.body.rotation.z=Math.sin(t*5)*0.03+recoil*0.08;u.body.rotation.x=-recoil*0.04}
 s.rotation.z=Math.sin(t*1.1)*0.04
 s.position.y=Math.abs(Math.sin(t*10))*0.03
}

// Renderer setup
const renderer=new THREE.WebGLRenderer({antialias:true,preserveDrawingBuffer:true})
renderer.setSize(window.innerWidth,window.innerHeight)
renderer.setPixelRatio(Math.min(window.devicePixelRatio,2))
renderer.toneMapping=THREE.ACESFilmicToneMapping
renderer.toneMappingExposure=1.0
document.body.appendChild(renderer.domElement)
const scene=new THREE.Scene()
scene.background=new THREE.Color(0x1a1a2e)
const camera=new THREE.PerspectiveCamera(50,window.innerWidth/window.innerHeight,0.1,100)
camera.position.set(0,1.5,5)
const controls=new OrbitControls(camera,renderer.domElement)
controls.enableDamping=true
controls.dampingFactor=0.08
controls.target.set(0,0,0)
const composer=new EffectComposer(renderer)
composer.addPass(new RenderPass(scene,camera))
composer.addPass(new UnrealBloomPass(new THREE.Vector2(window.innerWidth,window.innerHeight),1.2,0.4,0.85))
scene.add(new THREE.AmbientLight(0x404060,0.6))
const dl=new THREE.DirectionalLight(0xffffff,1.2)
dl.position.set(3,5,4)
scene.add(dl)
const fl=new THREE.DirectionalLight(0x8888ff,0.3)
fl.position.set(-3,2,-2)
scene.add(fl)
const rl=new THREE.DirectionalLight(0xffa040,0.2)
rl.position.set(0,-2,-4)
scene.add(rl)
// Stars
const sg=new THREE.BufferGeometry(),sv=[]
for(let i=0;i<500;i++)sv.push((Math.random()-0.5)*60,(Math.random()-0.5)*30,-10-Math.random()*20)
sg.setAttribute('position',new THREE.Float32BufferAttribute(sv,3))
scene.add(new THREE.Points(sg,new THREE.PointsMaterial({color:0xffffff,size:0.08,transparent:true,opacity:0.6})))

// State
let alien=null

function resetView(){
 if(alien){scene.remove(alien);alien=null}
 alien=makeScorpion()
 const b=new THREE.Box3().setFromObject(alien)
 const sz=b.getSize(new THREE.Vector3()),ct=b.getCenter(new THREE.Vector3())
 alien.position.sub(ct)
 const mx=Math.max(sz.x,sz.y,sz.z)
 alien.scale.setScalar(2.0/mx)
 scene.add(alien)
 camera.position.set(0,1.5,5)
 controls.target.set(0,0,0)
 controls.update()
 composer.render()
 document.getElementById('msg').textContent='Drag to orbit · Scroll to zoom · S = Screenshot'
}
function takeShot(){
 composer.render()
 const a=document.createElement('a')
 a.download='scorpion-preview.png'
 a.href=renderer.domElement.toDataURL('image/png')
 a.click()
 document.getElementById('msg').textContent='Screenshot saved!'
 setTimeout(()=>{document.getElementById('msg').textContent='Drag to orbit · Scroll to zoom · S = Screenshot'},2500)
}

// Events
document.querySelector('#ui button').addEventListener('click',()=>{if(alien)resetView();else resetView()})
document.getElementById('shotBtn').addEventListener('click',takeShot)
window.addEventListener('keydown',e=>{
 if(e.key==='r'||e.key==='R')resetView()
 if(e.key==='s'||e.key==='S')takeShot()
})
window.addEventListener('resize',()=>{
 camera.aspect=window.innerWidth/window.innerHeight
 camera.updateProjectionMatrix()
 renderer.setSize(window.innerWidth,window.innerHeight)
 composer.setSize(window.innerWidth,window.innerHeight)
})

// Loop
(function loop(){
 requestAnimationFrame(loop)
 if(alien)animScorpion(alien)
 controls.update()
 composer.render()
})()

resetView()
</script></body></html>
